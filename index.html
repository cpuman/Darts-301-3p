<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
const { useReducer, useRef, useEffect, useCallback, useMemo, useState } = React;

/* ─── constants ─── */
const SEGS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const START = 301;

const CO = {
  bg:"#0a0a0f",sf:"#14141e",red:"#ff3b30",grn:"#30d158",gld:"#ffd60a",
  txt:"#f5f5f7",mut:"#8e8e93",bdr:"rgba(255,255,255,0.08)",
  bust:"#ff6b6b",p1:"#5e9eff",p2:"#ff6bcb",
};

/* ─── score calc ─── */
function calcHit(x, y, cx, cy, R) {
  const dx=x-cx, dy=y-cy, d=Math.sqrt(dx*dx+dy*dy), r=d/R;
  if(r<=0.035) return {pts:50,lbl:"BULL",ring:"bull",dbl:true};
  if(r<=0.08)  return {pts:25,lbl:"25",ring:"obull",dbl:false};
  let a=Math.atan2(dy,dx)*180/Math.PI; a=(a+90+360)%360;
  const s=SEGS[Math.floor(((a+9)%360)/18)];
  if(r>0.76)                return {pts:0,    lbl:"Miss",  ring:"miss",  dbl:false};
  if(r>0.68)                return {pts:s*2,  lbl:"D"+s,   ring:"dbl",   dbl:true};
  if(r>0.4 && r<=0.44)      return {pts:s*3,  lbl:"T"+s,   ring:"trp",   dbl:false};
  return                           {pts:s,    lbl:""+s,    ring:"sgl",   dbl:false};
}

function ringCol(r){return r==="bull"?CO.red:r==="trp"?CO.gld:r==="dbl"?CO.grn:r==="miss"?CO.mut:CO.txt;}

/* ─── checkouts ─── */
const CK={170:"T20 T20 Bull",167:"T20 T19 Bull",164:"T20 T18 Bull",161:"T20 T17 Bull",160:"T20 T20 D20",158:"T20 T20 D19",157:"T20 T19 D20",156:"T20 T20 D18",155:"T20 T19 D19",154:"T20 T18 D20",153:"T20 T19 D18",152:"T20 T20 D16",151:"T20 T17 D20",150:"T20 T18 D18",148:"T20 T16 D20",147:"T20 T17 D18",146:"T20 T18 D16",145:"T20 T15 D20",144:"T20 T18 D15",143:"T20 T17 D16",142:"T20 T14 D20",141:"T20 T19 D12",140:"T20 T20 D10",138:"T20 T18 D12",136:"T20 T20 D8",135:"T20 T17 D12",134:"T20 T14 D16",133:"T20 T19 D8",132:"T20 T16 D12",131:"T20 T13 D16",130:"T20 T18 D8",127:"T20 T17 D8",125:"T20 T15 D10",121:"T20 T11 D14",120:"T20 20 D20",118:"T20 18 D20",117:"T20 17 D20",116:"T20 16 D20",115:"T20 15 D20",114:"T20 14 D20",113:"T20 13 D20",112:"T20 12 D20",111:"T20 11 D20",110:"T20 10 D20",108:"T20 8 D20",107:"T19 10 D20",106:"T20 6 D20",105:"T20 5 D20",104:"T20 4 D20",103:"T20 3 D20",102:"T20 2 D20",101:"T20 1 D20",100:"T20 D20",98:"T20 D19",97:"T19 D20",96:"T20 D18",95:"T19 D19",94:"T18 D20",92:"T20 D16",91:"T17 D20",90:"T18 D18",89:"T19 D16",88:"T16 D20",87:"T17 D18",86:"T18 D16",85:"T15 D20",84:"T20 D12",83:"T17 D16",82:"T14 D20",81:"T19 D12",80:"T20 D10",78:"T18 D12",76:"T20 D8",75:"T17 D12",74:"T14 D16",73:"T19 D8",72:"T16 D12",71:"T13 D16",70:"T18 D8",68:"T20 D4",67:"T17 D8",66:"T10 D18",65:"T19 D4",64:"T16 D8",62:"T10 D16",61:"T15 D8",60:"20 D20",58:"18 D20",56:"16 D20",54:"14 D20",52:"12 D20",50:"Bull",48:"8 D20",46:"6 D20",44:"4 D20",42:"2 D20",40:"D20",38:"D19",36:"D18",34:"D17",32:"D16",30:"D15",28:"D14",26:"D13",24:"D12",22:"D11",20:"D10",18:"D9",16:"D8",14:"D7",12:"D6",10:"D5",8:"D4",6:"D3",4:"D2",2:"D1"};

/* ─── GAME REDUCER ─── */
const mkPlayer = (name) => ({ name, score: START, turnStart: START, history: [], totalDarts: 0 });

const initialState = (n1,n2) => ({
  screen: "menu",
  players: [mkPlayer(n1), mkPlayer(n2)],
  active: 0,
  round: 1,
  darts: [],
  hits: [],
  busted: false,
  winner: null,
  lastHit: null,
  flash: false,
});

function reducer(state, action) {
  switch (action.type) {
    case "START_GAME": {
      return { ...initialState(action.n1, action.n2), screen: "play" };
    }
    case "SET_SCREEN": {
      return { ...state, screen: action.screen };
    }
    case "THROW": {
      if (state.darts.length >= 3 || state.busted || state.winner !== null) return state;
      const { x, y, hit } = action;
      const p = state.players[state.active];
      const newScore = p.score - hit.pts;
      if (newScore < 0 || newScore === 1 || (newScore === 0 && !hit.dbl)) {
        return {
          ...state,
          darts: [...state.darts, { x, y }],
          hits: [...state.hits, { ...hit, busted: true }],
          busted: true,
          lastHit: { ...hit, busted: true },
          flash: true,
        };
      }
      if (newScore === 0 && hit.dbl) {
        const newPlayers = state.players.map((pl, i) =>
          i === state.active ? { ...pl, score: 0, totalDarts: pl.totalDarts + state.darts.length + 1 } : pl
        );
        return {
          ...state,
          players: newPlayers,
          darts: [...state.darts, { x, y }],
          hits: [...state.hits, hit],
          winner: state.active,
          lastHit: hit,
          flash: true,
          screen: "win",
        };
      }
      const newPlayers = state.players.map((pl, i) =>
        i === state.active ? { ...pl, score: newScore } : pl
      );
      return {
        ...state,
        players: newPlayers,
        darts: [...state.darts, { x, y }],
        hits: [...state.hits, hit],
        lastHit: hit,
        flash: true,
      };
    }
    case "CLEAR_FLASH": {
      return { ...state, flash: false };
    }
    case "UNDO": {
      if (state.darts.length === 0) return state;
      const removedHit = state.hits[state.hits.length - 1];
      const wasBusted = state.busted;
      const newDarts = state.darts.slice(0, -1);
      const newHits = state.hits.slice(0, -1);
      let newPlayers = state.players;
      if (!wasBusted) {
        newPlayers = state.players.map((pl, i) =>
          i === state.active ? { ...pl, score: pl.score + removedHit.pts } : pl
        );
      }
      return {
        ...state,
        darts: newDarts,
        hits: newHits,
        busted: false,
        lastHit: newHits.length > 0 ? newHits[newHits.length - 1] : null,
        players: newPlayers,
      };
    }
    case "END_TURN": {
      const p = state.players[state.active];
      const turnRecord = {
        hits: [...state.hits],
        busted: state.busted,
        scoreAfter: state.busted ? p.turnStart : p.score,
      };
      const updatedPlayers = state.players.map((pl, i) => {
        if (i !== state.active) return pl;
        const finalScore = state.busted ? pl.turnStart : pl.score;
        return {
          ...pl,
          score: finalScore,
          turnStart: finalScore,
          history: [...pl.history, turnRecord],
          totalDarts: pl.totalDarts + state.darts.length,
        };
      });
      const nextActive = state.active === 0 ? 1 : 0;
      const nextRound = state.active === 1 ? state.round + 1 : state.round;
      return {
        ...state,
        players: updatedPlayers,
        active: nextActive,
        round: nextRound,
        darts: [],
        hits: [],
        busted: false,
        lastHit: null,
        flash: false,
        screen: "switching",
      };
    }
    case "READY": {
      return { ...state, screen: "play" };
    }
    case "RESET": {
      return initialState("Player 1", "Player 2");
    }
    default: return state;
  }
}

/* ─── Zoomable Board Component ─── */
function Board({ size, darts, onTap, disabled }) {
  const ref = useRef(null);
  const scaleR = useRef(1);
  const transR = useRef({ x: 0, y: 0 });
  const [, kick] = useState(0);
  const rr = () => kick(n => n + 1);

  const gest = useRef({ type: "none", t0: 0, p0: { x: 0, y: 0 }, moved: 0, pd: 0, pc: { x: 0, y: 0 }, ds: { x: 0, y: 0 }, ts: { x: 0, y: 0 } });
  const lock = useRef(false);

  const clamp = (tx, ty, s) => { const m = size * (s - 1) / 2; return { x: Math.max(-m, Math.min(m, tx)), y: Math.max(-m, Math.min(m, ty)) }; };
  const pinchDist = (tt) => { const a = tt[0].clientX - tt[1].clientX, b = tt[0].clientY - tt[1].clientY; return Math.sqrt(a * a + b * b); };

  const s2b = (clientX, clientY) => {
    const rc = ref.current.getBoundingClientRect();
    const s = scaleR.current, t = transR.current;
    const containerCX = rc.left + rc.width / 2;
    const containerCY = rc.top + rc.height / 2;
    const svgCenterScreenX = containerCX + t.x;
    const svgCenterScreenY = containerCY + t.y;
    const bx = (clientX - svgCenterScreenX) / s + size / 2;
    const by = (clientY - svgCenterScreenY) / s + size / 2;
    return { x: bx, y: by };
  };

  const onTS = useCallback(e => {
    const g = gest.current; g.moved = 0;
    if (e.touches.length === 2) {
      g.type = "pinch"; g.pd = pinchDist(e.touches);
      g.pc = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
      g.ts = { ...transR.current };
    } else if (e.touches.length === 1) {
      g.t0 = Date.now(); g.p0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      g.type = "tap";
      g.ds = { ...g.p0 }; g.ts = { ...transR.current };
    }
  }, []);

  const onTM = useCallback(e => {
    const g = gest.current;
    if (g.type === "pinch" && e.touches.length === 2) {
      e.preventDefault();
      const nd = pinchDist(e.touches), ns = Math.max(1, Math.min(5, scaleR.current * (nd / g.pd)));
      g.pd = nd;
      const nc = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
      transR.current = clamp(transR.current.x + nc.x - g.pc.x, transR.current.y + nc.y - g.pc.y, ns);
      g.pc = nc; scaleR.current = ns; rr();
    } else if (e.touches.length === 1) {
      const dx = e.touches[0].clientX - g.p0.x, dy = e.touches[0].clientY - g.p0.y;
      g.moved = Math.sqrt(dx * dx + dy * dy);
      const moveThreshold = scaleR.current > 1.05 ? 12 : 8;
      if (g.type === "tap" && g.moved > moveThreshold) {
        if (scaleR.current > 1.05) {
          g.type = "drag";
          g.ds = { ...g.p0 }; g.ts = { ...transR.current };
        } else {
          g.type = "cancel";
        }
      }
      if (g.type === "drag" && scaleR.current > 1.05) {
        e.preventDefault();
        transR.current = clamp(g.ts.x + e.touches[0].clientX - g.ds.x, g.ts.y + e.touches[0].clientY - g.ds.y, scaleR.current);
        rr();
      }
    }
  }, []);

  const onTE = useCallback(e => {
    const g = gest.current;
    if (e.touches.length === 0) {
      const moveThreshold = scaleR.current > 1.05 ? 12 : 8;
      const isTap = g.type === "tap" && g.moved < moveThreshold && Date.now() - g.t0 < 500;
      if (isTap && !disabled && !lock.current) {
        lock.current = true; setTimeout(() => { lock.current = false; }, 300);
        e.preventDefault();
        const p = s2b(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        if (p.x >= 0 && p.x <= size && p.y >= 0 && p.y <= size) onTap(p.x, p.y);
      }
      g.type = "none";
    } else if (e.touches.length === 1 && g.type === "pinch") {
      g.type = "drag"; g.ds = { x: e.touches[0].clientX, y: e.touches[0].clientY }; g.ts = { ...transR.current };
    }
  }, [disabled, onTap, size]);

  const resetZ = () => { scaleR.current = 1; transR.current = { x: 0, y: 0 }; rr(); };

  const sc = scaleR.current, tr = transR.current, R = size / 2;
  const sCol = (i, t) => { const e = i % 2 === 0; if (t === "trp" || t === "dbl") return e ? "#ff3b30" : "#30d158"; return e ? "#1a1a1a" : "#f5f5dc"; };

  const paths = useMemo(() => {
    const o = [];
    for (let i = 0; i < 20; i++) {
      const sa = (i * 18 - 9 - 90) * Math.PI / 180, ea = (i * 18 + 9 - 90) * Math.PI / 180;
      [{ i: 0.04, o: 0.4, t: "sgl" }, { i: 0.4, o: 0.44, t: "trp" }, { i: 0.44, o: 0.68, t: "sgl" }, { i: 0.68, o: 0.76, t: "dbl" }].forEach((rd, ri) => {
        const ir = rd.i * R, or_ = rd.o * R;
        o.push({ k: `${i}-${ri}`, d: `M${R + or_ * Math.cos(sa)} ${R + or_ * Math.sin(sa)}A${or_} ${or_} 0 0 1 ${R + or_ * Math.cos(ea)} ${R + or_ * Math.sin(ea)}L${R + ir * Math.cos(ea)} ${R + ir * Math.sin(ea)}A${ir} ${ir} 0 0 0 ${R + ir * Math.cos(sa)} ${R + ir * Math.sin(sa)}Z`, f: sCol(i, rd.t) });
      });
      const na = (i * 18 - 90) * Math.PI / 180;
      o.push({ k: `t${i}`, txt: true, x: R + 0.84 * R * Math.cos(na), y: R + 0.84 * R * Math.sin(na), v: SEGS[i] });
    }
    return o;
  }, [size]);

  return (
    <div style={{ position: "relative" }}>
      {sc > 1.05 && <button onClick={resetZ} style={{ position: "absolute", top: 8, right: 8, zIndex: 10, background: "rgba(0,0,0,.75)", border: `1px solid ${CO.bdr}`, color: CO.txt, fontSize: 12, fontWeight: 700, fontFamily: "inherit", padding: "6px 14px", borderRadius: 8, cursor: "pointer" }}>Reset x{sc.toFixed(1)}</button>}
      <div style={{ position: "absolute", bottom: 8, left: "50%", transform: "translateX(-50%)", zIndex: 10, background: "rgba(0,0,0,.55)", padding: "4px 12px", borderRadius: 8, fontSize: 11, color: CO.mut, fontWeight: 600, pointerEvents: "none" }}>
        {sc > 1.05 ? "Drag to pan" : "Pinch to zoom"}
      </div>
      <div ref={ref} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}
        style={{ width: size, height: size, margin: "0 auto", touchAction: "none", overflow: "hidden", borderRadius: "50%" }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
          style={{ transform: `translate(${tr.x}px,${tr.y}px) scale(${sc})`, transformOrigin: "center", transition: gest.current.type !== "none" ? "none" : "transform .2s ease-out", opacity: disabled ? .3 : 1, pointerEvents: "none" }}>
          <circle cx={R} cy={R} r={R * .78} fill="#2a2a2a" stroke="#444" strokeWidth={1} />
          {paths.map(p => p.txt
            ? <text key={p.k} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="central" fill="#f5f5f7" fontSize={size * .042} fontWeight={700} fontFamily="'SF Pro Display',system-ui" style={{ textShadow: "0 1px 3px rgba(0,0,0,.8)" }}>{p.v}</text>
            : <path key={p.k} d={p.d} fill={p.f} stroke="#333" strokeWidth={.5} opacity={.85} />
          )}
          <circle cx={R} cy={R} r={R * .08} fill={CO.grn} stroke="#222" strokeWidth={1} />
          <circle cx={R} cy={R} r={R * .035} fill={CO.red} stroke="#222" strokeWidth={.5} />
          {darts.map((d, i) => <g key={i}><circle cx={d.x} cy={d.y} r={Math.max(4, 7 / sc)} fill={CO.gld} stroke="#000" strokeWidth={Math.max(1, 2 / sc)} /><circle cx={d.x} cy={d.y} r={Math.max(8, 14 / sc)} fill="none" stroke={CO.gld} strokeWidth={Math.max(.5, 1 / sc)} opacity={.4} /></g>)}
        </svg>
      </div>
    </div>
  );
}

/* ─── MAIN ─── */
function App() {
  const [state, dispatch] = useReducer(reducer, initialState("Player 1", "Player 2"));
  const [names, setNames] = useState(["Player 1", "Player 2"]);
  const vidRef = useRef(null);
  const streamRef = useRef(null);
  const [camOn, setCamOn] = useState(false);
  const [camErr, setCamErr] = useState(null);
  const [bSize, setBSize] = useState(Math.min(window.innerWidth - 24, 520));
  const F = "'SF Pro Display',-apple-system,system-ui,sans-serif";

  // Responsive board size
  useEffect(() => {
    const onResize = () => setBSize(Math.min(window.innerWidth - 24, 520));
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const { screen, players, active, round, darts, hits, busted, winner, lastHit, flash } = state;
  const ap = players[active];
  const pc = active === 0 ? CO.p1 : CO.p2;

  // Camera
  useEffect(() => {
    if (screen === "play") {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => { streamRef.current = s; if (vidRef.current) vidRef.current.srcObject = s; setCamOn(true); })
        .catch(() => { setCamErr("Camera denied — tap to score!"); setCamOn(false); });
    } else {
      if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
      setCamOn(false);
    }
    return () => { if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); } };
  }, [screen]);

  // Clear flash
  useEffect(() => { if (flash) { const t = setTimeout(() => dispatch({ type: "CLEAR_FLASH" }), 700); return () => clearTimeout(t); } }, [flash]);

  const handleTap = useCallback((x, y) => {
    const hit = calcHit(x, y, bSize / 2, bSize / 2, bSize / 2);
    dispatch({ type: "THROW", x, y, hit });
  }, [bSize]);

  const canEnd = darts.length === 3 || busted;
  const checkout = CK[ap.score];
  const otherIdx = active === 0 ? 1 : 0;

  /* ── MENU ── */
  if (screen === "menu") return (
    <div style={{ minHeight: "100dvh", background: `linear-gradient(160deg,${CO.bg},#0f0f1a,#141420)`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: F, color: CO.txt, padding: 24, gap: 28 }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 72, marginBottom: 8, filter: "drop-shadow(0 0 20px rgba(255,59,48,.3))" }}>&#127919;</div>
        <h1 style={{ fontSize: 48, fontWeight: 900, margin: "0 0 4px", letterSpacing: -2, background: "linear-gradient(135deg,#fff,#bbb)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>301</h1>
        <p style={{ color: CO.mut, fontSize: 15, margin: 0, letterSpacing: 2, fontWeight: 500 }}>2 PLAYER &middot; DOUBLE OUT</p>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%", maxWidth: 300 }}>
        {[0, 1].map(i => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, background: CO.sf, borderRadius: 14, padding: "4px 4px 4px 16px", border: `1px solid ${i === 0 ? CO.p1 : CO.p2}30` }}>
            <div style={{ width: 10, height: 10, borderRadius: "50%", background: i === 0 ? CO.p1 : CO.p2, flexShrink: 0 }} />
            <input value={names[i]} onChange={e => setNames(p => p.map((n, j) => j === i ? e.target.value : n))} placeholder={`Player ${i + 1}`}
              style={{ flex: 1, background: "none", border: "none", color: CO.txt, fontSize: 16, fontWeight: 600, fontFamily: F, padding: "12px 4px", outline: "none" }} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%", maxWidth: 300 }}>
        <button onClick={() => dispatch({ type: "START_GAME", n1: names[0] || "Player 1", n2: names[1] || "Player 2" })}
          style={{ padding: 18, borderRadius: 16, border: "none", background: `linear-gradient(135deg,${CO.red},#cc2d24)`, color: "#fff", fontSize: 17, fontWeight: 700, fontFamily: F, cursor: "pointer", boxShadow: `0 8px 32px ${CO.red}40` }}>
          &#9654; Start Game
        </button>
        <button onClick={() => dispatch({ type: "SET_SCREEN", screen: "rules" })}
          style={{ padding: 18, borderRadius: 16, border: `1px solid ${CO.bdr}`, background: "rgba(255,255,255,.04)", color: CO.txt, fontSize: 17, fontWeight: 600, fontFamily: F, cursor: "pointer" }}>
          Rules
        </button>
      </div>
      <style>{`input::placeholder{color:${CO.mut}}`}</style>
    </div>
  );

  /* ── RULES ── */
  if (screen === "rules") return (
    <div style={{ minHeight: "100dvh", background: CO.bg, fontFamily: F, color: CO.txt, padding: 24 }}>
      <button onClick={() => dispatch({ type: "SET_SCREEN", screen: "menu" })} style={{ background: "none", border: "none", color: CO.red, fontSize: 17, fontWeight: 600, fontFamily: F, cursor: "pointer", padding: "8px 0", marginBottom: 20 }}>&larr; Back</button>
      <h2 style={{ fontSize: 28, fontWeight: 800, marginBottom: 20, letterSpacing: -1 }}>301 Rules</h2>
      {[
        ["\ud83d\udc65", "2 Players", "Take turns. Each player starts at 301 and counts down."],
        ["\ud83c\udfaf", "3 Darts / Turn", "Throw 3 darts each turn. Tap the board where each dart lands."],
        ["\u270c\ufe0f", "Double Out", "Your final dart must land on a double or bullseye to hit exactly 0."],
        ["\ud83d\udca5", "Bust", "If your score drops below 0, hits 1, or reaches 0 without a double \u2014 BUST. Score resets to what it was at the start of your turn."],
        ["\ud83d\udd0d", "Pinch to Zoom", "Pinch the board to zoom up to 5x for precise tapping."],
        ["\ud83d\udca1", "Checkout Hints", "When \u2264 170, a suggested finish route appears."],
      ].map(([e, t, d], i) => (
        <div key={i} style={{ display: "flex", gap: 14, padding: 16, background: CO.sf, borderRadius: 14, marginBottom: 10, border: `1px solid ${CO.bdr}` }}>
          <span style={{ fontSize: 26, flexShrink: 0 }}>{e}</span>
          <div><div style={{ fontSize: 15, fontWeight: 700, marginBottom: 2 }}>{t}</div><div style={{ fontSize: 13, color: CO.mut, lineHeight: 1.5 }}>{d}</div></div>
        </div>
      ))}
    </div>
  );

  /* ── SWITCHING ── */
  if (screen === "switching") return (
    <div style={{ minHeight: "100dvh", background: CO.bg, fontFamily: F, color: CO.txt, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, gap: 24 }}>
      <div style={{ display: "flex", gap: 12, width: "100%", maxWidth: 340 }}>
        {players.map((p, i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", padding: "16px 12px", background: CO.sf, borderRadius: 14, border: `2px solid ${i === active ? (i === 0 ? CO.p1 : CO.p2) : CO.bdr}` }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: i === 0 ? CO.p1 : CO.p2, letterSpacing: 1, marginBottom: 6 }}>{p.name.toUpperCase()}</div>
            <div style={{ fontSize: 40, fontWeight: 900 }}>{p.score}</div>
          </div>
        ))}
      </div>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 14, color: CO.mut, fontWeight: 600, letterSpacing: 1, marginBottom: 8 }}>ROUND {round}</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
          <div style={{ width: 14, height: 14, borderRadius: "50%", background: pc }} />
          <span style={{ fontSize: 24, fontWeight: 800, color: pc }}>{ap.name}'s Turn</span>
        </div>
      </div>
      <button onClick={() => dispatch({ type: "READY" })}
        style={{ padding: "18px 48px", borderRadius: 16, border: "none", background: `linear-gradient(135deg,${pc},${pc}cc)`, color: "#fff", fontSize: 17, fontWeight: 700, fontFamily: F, cursor: "pointer", boxShadow: `0 8px 32px ${pc}30` }}>
        Ready — Throw!
      </button>
    </div>
  );

  /* ── WIN ── */
  if (screen === "win" && winner !== null) {
    const w = players[winner];
    return (
      <div style={{ minHeight: "100dvh", background: CO.bg, fontFamily: F, color: CO.txt, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, gap: 20 }}>
        <div style={{ fontSize: 80, animation: "pop .6s ease-out" }}>&#127942;</div>
        <h1 style={{ fontSize: 36, fontWeight: 900, margin: 0, color: winner === 0 ? CO.p1 : CO.p2, textShadow: `0 0 40px ${winner === 0 ? CO.p1 : CO.p2}40`, textAlign: "center" }}>{w.name} wins!</h1>
        <p style={{ color: CO.mut, fontSize: 15, margin: 0 }}>{w.totalDarts} darts &middot; {w.history.length + 1} turns</p>
        <div style={{ display: "flex", gap: 12, width: "100%", maxWidth: 340 }}>
          {players.map((p, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center", padding: "16px 12px", background: CO.sf, borderRadius: 14, border: `2px solid ${i === winner ? (i === 0 ? CO.p1 : CO.p2) : CO.bdr}` }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: i === 0 ? CO.p1 : CO.p2, letterSpacing: 1, marginBottom: 8 }}>{p.name.toUpperCase()}</div>
              <div style={{ fontSize: 36, fontWeight: 900, marginBottom: 4 }}>{p.score}</div>
              <div style={{ fontSize: 11, color: CO.mut }}>{p.totalDarts + (i === active ? darts.length : 0)} darts</div>
            </div>
          ))}
        </div>
        <button onClick={() => dispatch({ type: "RESET" })}
          style={{ marginTop: 12, padding: "18px 48px", borderRadius: 16, border: "none", background: `linear-gradient(135deg,${CO.grn},#28b84d)`, color: "#fff", fontSize: 17, fontWeight: 700, fontFamily: F, cursor: "pointer", boxShadow: `0 8px 32px ${CO.grn}30` }}>
          Play Again
        </button>
        <style>{`@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}`}</style>
      </div>
    );
  }

  /* ── PLAY ── */
  return (
    <div style={{ minHeight: "100dvh", background: CO.bg, fontFamily: F, color: CO.txt, position: "relative" }}>
      <div style={{ position: "fixed", inset: 0, zIndex: 0, background: "#000" }}>
        <video ref={vidRef} autoPlay playsInline muted style={{ width: "100%", height: "100%", objectFit: "cover", opacity: camOn ? .12 : 0 }} />
        {!camOn && <div style={{ position: "absolute", inset: 0, background: `radial-gradient(ellipse,#1a1a24,${CO.bg})` }} />}
      </div>

      <div style={{ position: "relative", zIndex: 1, padding: "10px 12px 80px", paddingTop: "max(10px, env(safe-area-inset-top))" }}>
        {/* Top */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <button onClick={() => dispatch({ type: "RESET" })} style={{ background: "rgba(255,255,255,.08)", border: "none", color: CO.txt, fontSize: 13, fontWeight: 600, fontFamily: F, padding: "7px 12px", borderRadius: 10, cursor: "pointer" }}>&#10005; End</button>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 10, height: 10, borderRadius: "50%", background: pc }} />
            <span style={{ fontSize: 13, fontWeight: 700, color: pc }}>{ap.name}</span>
            <span style={{ fontSize: 11, color: CO.mut, fontWeight: 600 }}>R{round}</span>
          </div>
          <button onClick={() => dispatch({ type: "UNDO" })} disabled={!darts.length}
            style={{ background: darts.length ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.03)", border: "none", color: darts.length ? CO.txt : CO.mut, fontSize: 13, fontWeight: 600, fontFamily: F, padding: "7px 12px", borderRadius: 10, opacity: darts.length ? 1 : .4, cursor: "pointer" }}>&#8617; Undo</button>
        </div>

        {/* Scoreboard */}
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          {players.map((p, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center", padding: "8px 6px", borderRadius: 14,
              background: i === active ? `${i === 0 ? CO.p1 : CO.p2}10` : "rgba(255,255,255,.02)",
              border: `2px solid ${i === active ? `${i === 0 ? CO.p1 : CO.p2}50` : CO.bdr}` }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: i === 0 ? CO.p1 : CO.p2, letterSpacing: 1, marginBottom: 2 }}>
                {p.name.toUpperCase()}{i === active ? " \u25C0" : ""}
              </div>
              <div style={{ fontSize: 34, fontWeight: 900, letterSpacing: -2, lineHeight: 1.1,
                color: i === active && busted ? CO.bust : CO.txt }}>
                {i === active && busted ? ap.turnStart : p.score}
              </div>
            </div>
          ))}
        </div>

        {/* Bust / hit flash */}
        {busted && (
          <div style={{ textAlign: "center", marginBottom: 6, padding: 6, borderRadius: 10, background: `${CO.bust}15`, border: `1px solid ${CO.bust}30` }}>
            <span style={{ fontSize: 14, fontWeight: 800, color: CO.bust, letterSpacing: 2, animation: "pop .4s ease-out" }}>BUST!</span>
          </div>
        )}
        {lastHit && flash && !busted && (
          <div style={{ textAlign: "center", marginBottom: 4, fontSize: 15, fontWeight: 800, color: ringCol(lastHit.ring), animation: "pop .4s ease-out" }}>&minus;{lastHit.pts} {lastHit.lbl}</div>
        )}

        {/* Checkout */}
        {checkout && !busted && ap.score > 0 && (
          <div style={{ textAlign: "center", marginBottom: 6, padding: "5px 14px", background: "rgba(255,214,10,.08)", borderRadius: 10, border: "1px solid rgba(255,214,10,.15)" }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: CO.gld, letterSpacing: 1 }}>CHECKOUT </span>
            <span style={{ fontSize: 13, fontWeight: 800, color: CO.gld }}>{checkout}</span>
          </div>
        )}

        {camErr && <div style={{ textAlign: "center", fontSize: 11, color: CO.gld, marginBottom: 4, padding: "4px 10px", background: "rgba(255,214,10,.06)", borderRadius: 8 }}>{camErr}</div>}

        {/* Board */}
        <div style={{ marginBottom: 10 }}>
          <Board size={bSize} darts={darts} onTap={handleTap} disabled={busted || darts.length >= 3} />
        </div>

        {/* Dart slots */}
        <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 10 }}>
          {[0, 1, 2].map(i => {
            const h = hits[i]; const col = h ? (h.busted ? CO.bust : ringCol(h.ring)) : CO.mut;
            return (
              <div key={i} style={{ flex: 1, maxWidth: 120, padding: "10px 6px", borderRadius: 14,
                background: h ? `linear-gradient(135deg,${col}12,${col}06)` : "rgba(255,255,255,.03)",
                border: `1px solid ${h ? `${col}25` : CO.bdr}`, textAlign: "center" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: col, letterSpacing: .5, marginBottom: 3 }}>{h ? (h.busted ? "BUST" : h.lbl) : `DART ${i + 1}`}</div>
                <div style={{ fontSize: 24, fontWeight: 900, color: h ? (h.busted ? CO.bust : CO.txt) : "rgba(255,255,255,.1)" }}>{h ? h.pts : "\u2013"}</div>
              </div>
            );
          })}
        </div>

        {/* End Turn */}
        {canEnd && (
          <button onClick={() => dispatch({ type: "END_TURN" })}
            style={{ width: "100%", padding: 16, borderRadius: 16, border: "none",
              background: busted ? `linear-gradient(135deg,${CO.bust},#cc4444)` : `linear-gradient(135deg,${pc},${pc}cc)`,
              color: "#fff", fontSize: 16, fontWeight: 700, fontFamily: F, cursor: "pointer",
              boxShadow: `0 8px 32px ${busted ? CO.bust : pc}25`, marginBottom: 14 }}>
            {busted ? "Bust \u2014 End Turn \u2192" : `End Turn \u2192 ${players[otherIdx].name}`}
          </button>
        )}

        {/* History */}
        {ap.history.length > 0 && (
          <div style={{ background: "rgba(255,255,255,.03)", borderRadius: 14, border: `1px solid ${CO.bdr}`, overflow: "hidden" }}>
            <div style={{ padding: "8px 14px", fontSize: 11, fontWeight: 700, color: pc, letterSpacing: 1.5, borderBottom: `1px solid ${CO.bdr}` }}>{ap.name.toUpperCase()} HISTORY</div>
            {ap.history.slice().reverse().slice(0, 5).map((h, idx) => (
              <div key={idx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 14px", borderBottom: idx < Math.min(ap.history.length, 5) - 1 ? `1px solid ${CO.bdr}` : "none" }}>
                <div style={{ display: "flex", gap: 6, flex: 1 }}>
                  {h.hits.map((s, j) => (
                    <span key={j} style={{ fontSize: 11, fontWeight: 700, color: s.busted ? CO.bust : ringCol(s.ring), background: `${s.busted ? CO.bust : ringCol(s.ring)}12`, padding: "2px 7px", borderRadius: 6 }}>{s.busted ? "\u2715" : s.lbl}</span>
                  ))}
                </div>
                <div style={{ textAlign: "right", minWidth: 50 }}>
                  {h.busted && <span style={{ fontSize: 10, fontWeight: 700, color: CO.bust, marginRight: 6 }}>BUST</span>}
                  <span style={{ fontSize: 13, fontWeight: 700, color: CO.mut }}>{h.scoreAfter}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <style>{`
        @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
        *{-webkit-tap-highlight-color:transparent;user-select:none}
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
